<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c2a3e"/>
      <stop offset="1" stop-color="#16151f"/>
    </linearGradient>
  </defs>

  <!-- background, same dark tone as the app -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- antennas -->
  <g stroke="#fff" stroke-width="26" stroke-linecap="round">
    <line x1="214" y1="150" x2="168" y2="88"/>
    <line x1="298" y1="150" x2="344" y2="88"/>
  </g>

  <!-- screen -->
  <rect x="92" y="150" width="328" height="226" rx="44" fill="none" stroke="#fff" stroke-width="28"/>

  <!-- play -->
  <path d="M226 212 L310 263 L226 314 Z" fill="#fff" stroke="#fff" stroke-width="14" stroke-linejoin="round"/>

  <!-- Italian tricolor -->
  <g>
    <rect x="160" y="408" width="64" height="26" rx="13" fill="#009246"/>
    <rect x="224" y="408" width="64" height="26" fill="#ffffff"/>
    <rect x="288" y="408" width="64" height="26" rx="13" fill="#ce2b37"/>
    <rect x="200" y="408" width="24" height="26" fill="#009246"/>
    <rect x="288" y="408" width="24" height="26" fill="#ce2b37"/>
  </g>
</svg>
